<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 490" width="820" height="490" role="img" aria-labelledby="t d">
<title id="t">Bot command lines that behave like a real Ubuntu 22.04 server</title>
<desc id="d">47 of 90 lines matched before this work and 90 of 90 after.</desc>
